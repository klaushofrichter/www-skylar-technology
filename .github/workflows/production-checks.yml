name: Production PR checks

# Both branches, not just production. PRs to main - Dependabot's, in
# particular - previously ran nothing at all: build-push.yml triggers on push,
# and this file only listened for production. Dependency bumps were landing on
# main unverified and were first tested when someone opened the promotion PR.
on:
  pull_request:
    branches: [main, production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-from-dockerfile

      - run: npm ci

      # The build compiles `src` alone, and vitest/playwright strip types
      # without checking them, so nothing verified `test/` or `e2e/` typed
      # correctly - a broken @types/* bump would go green. This covers all
      # three. In `test` for the same reason as the audit below: it is a
      # required check, so a separate job would gate nothing.
      - run: npm run typecheck

      - run: npm test

      # Dependabot notices a vulnerable dependency, but noticing is not
      # blocking: without this step a package with a known advisory can be
      # merged and deployed while its fix PR sits open. This goes in `test`
      # rather than a job of its own because `test` is a required status check
      # on production - a new job would gate nothing until someone remembered
      # to add it to branch protection.
      #
      # Threshold is `high` rather than the default so that a moderate advisory
      # whose only fix is a major upgrade cannot wedge unrelated merges - the
      # alerts still surface those, they just do not stop the queue.
      - run: npm audit --audit-level=high

  e2e:
    # The release gate, in a browser, on GitHub's runners: `npx playwright
    # install` on the in-cluster self-hosted runner OOM-killed it at 512Mi,
    # which GitHub reports as "the self-hosted runner lost communication with
    # the server" and which also killed the release step that followed.
    #
    # It tests the Docker image this commit builds, the same artifact the
    # deploy ships, in four browsers: desktop Chrome, an Android phone, an
    # iPhone (WebKit, i.e. Safari) and desktop Firefox. Then Lighthouse,
    # Google's PageSpeed engine, on a phone profile. One job, so the required
    # check stays the single `e2e` context. This is kube-setup's "public web
    # pages" baseline (docs/cluster-deployment-requirements.md, §4), adapted
    # from klaushofrichter/christina.art and klaushofrichter/www-klaushofrichter.
    runs-on: ubuntu-latest
    # A stalled browser download once ran for GitHub's 6-hour default before
    # it was cancelled (promotion #55), holding up the merge the whole time.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-from-dockerfile

      - run: npm ci

      - name: Build and start the image
        run: |
          set -euo pipefail
          docker build --build-arg APP_VERSION=2099.01.01.1 -t www-skylar-technology:e2e .
          docker run -d --name site -p 8080:8080 www-skylar-technology:e2e
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health >/dev/null && break
            echo "waiting for the image (${i}/30)"; sleep 1
          done
          curl -sf http://localhost:8080/health | grep -q '"version":"2099.01.01.1"' \
            || { echo "::error::the image did not come up with the stamped version"; docker logs site; exit 1; }

      # `--with-deps` runs `apt-get update`, which also reads the Google
      # Chrome source the runner image ships; one bad index there fails the
      # whole job (it did, 2026-09-09, in art), so drop that source. The Chrome
      # binary itself stays: Lighthouse uses it below.
      - name: Install the browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit firefox

      # failOnFlakyTests (playwright.config.ts) fails this step if any test
      # passed only on its retry.
      - name: Walk the site in four browsers
        env:
          BASE_URL: http://localhost:8080
          EXPECT_VERSION: 2099.01.01.1
        run: npx playwright test

      - name: Lighthouse (Google PageSpeed) on a phone
        run: scripts/lighthouse-gate.sh http://localhost:8080/

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report.report.html
          retention-days: 14

      - name: Server log when something failed
        if: failure()
        run: docker logs site || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never

      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          total=$(jq -s '[.[].runs[].results[]] | length' sarif-results/*.sarif)
          echo "CodeQL findings: $total"
          if [ "$total" -gt 0 ]; then
            echo "::error::CodeQL found $total finding(s) — blocking merge"
            exit 1
          fi
