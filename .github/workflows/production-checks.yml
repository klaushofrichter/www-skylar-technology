name: Production PR checks

# Both branches, not just production. PRs to main - Dependabot's, in
# particular - previously ran nothing at all: build-push.yml triggers on push,
# and this file only listened for production. Dependency bumps were landing on
# main unverified and were first tested when someone opened the promotion PR.
on:
  pull_request:
    branches: [main, production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm ci

      # The build compiles `src` alone, and vitest/playwright strip types
      # without checking them, so nothing verified `test/` or `e2e/` typed
      # correctly - a broken @types/* bump would go green. This covers all
      # three. In `test` for the same reason as the audit below: it is a
      # required check, so a separate job would gate nothing.
      - run: npm run typecheck

      - run: npm test

      # Dependabot notices a vulnerable dependency, but noticing is not
      # blocking: without this step a package with a known advisory can be
      # merged and deployed while its fix PR sits open. This goes in `test`
      # rather than a job of its own because `test` is a required status check
      # on production - a new job would gate nothing until someone remembered
      # to add it to branch protection.
      #
      # Threshold is `high` rather than the default so that a moderate advisory
      # whose only fix is a major upgrade cannot wedge unrelated merges - the
      # alerts still surface those, they just do not stop the queue.
      - run: npm audit --audit-level=high

  e2e:
    # The Playwright suite runs here, on GitHub's runners, rather than in the
    # deploy. Two reasons, in order of importance: a browser-level regression
    # is caught while it can still be stopped, instead of once it is already
    # live; and `npx playwright install` on the in-cluster self-hosted runner
    # OOM-killed it at 512Mi, which GitHub reports as "the self-hosted runner
    # lost communication with the server" and which also killed the release
    # step that followed.
    #
    # Against a locally started server, not production - this gates the merge,
    # so it has to be able to run before anything is deployed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Start the server and run the suite
        env:
          BASE_URL: http://localhost:8080
        run: |
          set -euo pipefail
          npm start &
          echo $! > /tmp/server.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/health >/dev/null && break
            echo "waiting for server (${i}/20)"; sleep 2
          done
          curl -sf http://localhost:8080/health >/dev/null \
            || { echo "::error::server did not come up"; exit 1; }
          npm run test:e2e
          kill "$(cat /tmp/server.pid)" || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never

      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          total=0
          for f in sarif-results/*.sarif; do
            count=$(jq '[.runs[].results[]] | length' "$f")
            total=$((total + count))
          done
          echo "CodeQL findings: $total"
          if [ "$total" -gt 0 ]; then
            echo "::error::CodeQL found $total finding(s) — blocking merge"
            exit 1
          fi
