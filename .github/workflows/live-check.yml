name: Live check

# The release, checked from outside after it has gone live: the read-only
# part of the e2e suite (tests tagged @live) and Lighthouse, pointed at
# https://www.skylar.technology, and /health and the footer must name the
# release just cut.
#
# deploy-production.yml already smoke-tests with curl from the in-cluster
# runner; this adds what curl cannot see (real browsers on a phone and a
# desktop, every link followed, accessibility, Lighthouse). A browser cannot
# run on the in-cluster runner (512Mi), so it runs here, on GitHub's runners,
# after each successful deploy and once a day, so a site that breaks between
# releases is noticed too.
#
# Read-only: @live tests only GET, never POST (the site has no sign-in).
# kube-setup's "public web pages" baseline, adapted from
# klaushofrichter/christina.art and klaushofrichter/www-klaushofrichter.
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
  schedule:
    - cron: '23 11 * * *'   # 05:23 Chicago (CST), outside the busy hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    # After a deploy only if it succeeded; a failed deploy cut no release.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://www.skylar.technology
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-from-dockerfile

      - run: npm ci

      # The newest release is what must be live: after a deploy it is the one
      # that deploy cut (the release step runs last, after the rollout).
      - name: Which release should be live
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "expecting ${tag}"

      - name: Install the browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit firefox

      - name: Walk the live site in four browsers
        env:
          EXPECT_VERSION: ${{ steps.rel.outputs.version }}
        run: npx playwright test --grep @live

      - name: Lighthouse (Google PageSpeed) on the live site
        run: scripts/lighthouse-gate.sh https://www.skylar.technology/

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-check-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report.report.html
          retention-days: 30
