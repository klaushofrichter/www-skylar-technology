name: Build and publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-from-dockerfile

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:main` only. `:<sha>` and `:latest` belong to deploy-production.yml
      # alone. This build used to push both, which made them contested: the
      # cluster manifest pins `:<sha>`, so if this build ever ran for the same
      # commit as a release, whichever finished last owned the tag and the next
      # pod restart would silently run an untested main build (it happened to
      # kauf-server). We were shielded only because promotions are merge
      # commits that never exist on main - one fast-forward promotion would have
      # opened the race. And `:latest` meant "production" or "newest main build"
      # depending on which workflow ran last. Now `:latest` is always the
      # release. See kube-setup docs/cluster-deployment-requirements.md, Traps.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/klaushofrichter/www-skylar-technology:main
