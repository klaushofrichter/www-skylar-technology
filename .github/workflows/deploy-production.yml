name: Deploy production

on:
  push:
    branches: [production]

permissions:
  contents: write   # create the release tag, and clear the published notes on main
  packages: write

jobs:
  deploy:
    runs-on: [self-hosted, k3s]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # release notes are computed from history and tags

      - name: Generate the version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Re-running a deploy that already released must not mint a second
          # tag for the same commit. The counter below is derived from how many
          # releases the day already has, so a re-run would count its own
          # release and produce a fresh number for a commit that is already
          # out. Ask the releases whether this exact commit has one first; if
          # so, reuse its version and let the tag step skip as already-released.
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                       --jq ".[] | select(.target_commitish == \"${GITHUB_SHA}\") | .tag_name" \
                     | awk 'NR==1')
          if [ -n "$EXISTING" ]; then
            VERSION="${EXISTING#v}"
            echo "Commit ${GITHUB_SHA} is already released as ${EXISTING} — reusing that version."
          else
            # Calendar versioning, generated here rather than carried in the
            # sources: nothing to remember to bump, and the number says when the
            # build shipped. Dated in Central time so an evening deploy is not
            # filed under tomorrow.
            DATE=$(TZ=America/Chicago date +%Y.%m.%d)
            # Same-day counter, derived from the releases that already exist —
            # the tags are the state, so nothing needs storing.
            TODAY=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                      --json tagName -q '.[].tagName' | grep -c "^v${DATE}\." || true)
            VERSION="${DATE}.$((TODAY + 1))"
            echo "Releasing v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install kubectl and configure in-cluster access
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi
          kubectl version --client
          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster in-cluster \
            --server=https://kubernetes.default.svc \
            --certificate-authority="${SA_DIR}/ca.crt"
          kubectl config set-credentials deploy-sa --token="$(cat "${SA_DIR}/token")"
          kubectl config set-context in-cluster --cluster=in-cluster --user=deploy-sa --namespace=www-skylar-technology
          kubectl config use-context in-cluster

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/klaushofrichter/www-skylar-technology:${{ github.sha }}
            ghcr.io/klaushofrichter/www-skylar-technology:v${{ steps.ver.outputs.version }}
            ghcr.io/klaushofrichter/www-skylar-technology:latest

      - name: Prune old Docker images
        run: docker system prune -af --filter "until=168h" || true

      - name: Update kube-setup manifest and deploy
        env:
          KUBE_SETUP_DEPLOY_TOKEN: ${{ secrets.KUBE_SETUP_DEPLOY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MANIFEST=manifests/www-skylar-technology/www-skylar-technology-ksvc.yaml
          IMAGE=ghcr.io/klaushofrichter/www-skylar-technology
          # $RUNNER_TEMP, not /tmp: the runner empties it at the start and end of
          # every job, failed ones included. This clone's .git/config holds the
          # token from the URL, and on the long-lived self-hosted runner a /tmp
          # clone outlived any run that failed before its own `rm -rf`. The rm
          # here only means a clone never depends on that guarantee.
          rm -rf "$RUNNER_TEMP/kube-setup-deploy"
          git clone "https://x-access-token:${KUBE_SETUP_DEPLOY_TOKEN}@github.com/klaushofrichter/kube-setup.git" "$RUNNER_TEMP/kube-setup-deploy"
          cd "$RUNNER_TEMP/kube-setup-deploy"
          git config user.name "www-skylar-technology-deploy-bot"
          git config user.email "actions@users.noreply.github.com"

          # Every repo on this cluster deploys by pushing to this one shared
          # repo, so its main can move between our clone and our push - and it
          # does: v2026.09.12.1 died here because www-klaushofrichter pushed in
          # the four seconds we took to build the commit ("cannot lock ref
          # refs/heads/main"). That is a race to retry, not a deploy failure.
          #
          # Each attempt re-derives the edit from fresh upstream rather than
          # rebasing a commit we already made. The change is one line rewritten
          # to a fixed value, so recomputing it against whatever main now says
          # cannot conflict, and a reset --hard discards the stale attempt
          # along with it. Other repos touch other files, so their work rides
          # along untouched.
          pushed=""
          for attempt in $(seq 1 5); do
            git fetch -q origin main
            git reset -q --hard origin/main
            sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${SHA}|" "$MANIFEST"
            grep -q "image: ${IMAGE}:${SHA}$" "$MANIFEST" \
              || { echo "::error::manifest image line did not update to ${SHA}"; exit 1; }
            git add "$MANIFEST"
            if git diff --cached --quiet; then
              echo "No manifest change (image tag already up to date) — skipping commit/push."
              pushed=1; break
            fi
            git commit -q -m "Deploy www-skylar-technology ${SHA}"
            # HEAD:main, not "origin main": we reset to origin/main above, so
            # this pushes exactly what we built regardless of the local branch name.
            if git push -q origin HEAD:main; then
              echo "Manifest pushed on attempt ${attempt}."
              pushed=1; break
            fi
            echo "Push rejected — kube-setup main moved, re-deriving (attempt ${attempt}/5)."
            sleep $((attempt * 3))
          done
          # Never fall through to the apply: without the push, the cluster would
          # get an image the manifest in git does not record.
          [ -n "$pushed" ] || {
            echo "::error::could not push the manifest update after 5 attempts"
            exit 1
          }

          kubectl apply -f "$MANIFEST"

      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl wait --for=condition=Ready ksvc/www-skylar-technology -n www-skylar-technology --timeout=120s
          kubectl get ksvc www-skylar-technology -n www-skylar-technology

      # Deliberately curl and not Playwright. The browser suite runs on
      # GitHub's runners in production-checks.yml, before the merge that gets
      # here - installing a browser on this runner OOM-killed it at 512Mi,
      # which GitHub reports as "the self-hosted runner lost communication with
      # the server", and it keeps browser work off a node that also runs
      # everything else on this cluster.
      #
      # This runs before the release is tagged, not after. It used to be the
      # other way round: the tag was cut as soon as the rollout reported Ready
      # and the smoke test ran afterwards, so a release could exist for a build
      # that had never answered on the public URL. That is not hypothetical -
      # it is what produced v2026.08.28.2 and .3 when the runner was OOM-killed
      # at this step.
      - name: Smoke-test production
        id: smoke
        env:
          BASE_URL: https://www.skylar.technology
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          BASE="$BASE_URL"
          # The deployed build must be the one this run just stamped, so the
          # version is checked inside the retry loop rather than once after it:
          # ingress can still answer from the previous revision for a moment
          # after the ksvc reports Ready, and that is a race to wait out, not a
          # deploy failure.
          code=""; served=""; ok=""
          for i in $(seq 1 10); do
            code=$(curl -s -o "$RUNNER_TEMP/health.json" -w "%{http_code}" "$BASE/health" || true)
            if [ "$code" = "200" ]; then
              # grep -o, not a greedy sed: this pins to the "version" key itself
              # rather than to the last thing in the payload that looks like one.
              # `|| true`: pipefail would otherwise turn a version-less body
              # into a hard failure instead of a retry.
              served=$(grep -o '"version":"[^"]*"' "$RUNNER_TEMP/health.json" | head -1 | cut -d'"' -f4 || true)
              if [ "$served" = "$VERSION" ]; then
                ok=1; echo "health ok, serving ${served}"; break
              fi
              echo "still serving ${served:-unknown}, waiting for ${VERSION} (retry ${i}/10)"
            else
              echo "health not ready (HTTP ${code}), retry ${i}/10"
            fi
            sleep 6
          done
          [ -n "$ok" ] || {
            echo "::error::/health never reported ${VERSION} (last: HTTP ${code:-none}, version ${served:-none})"
            exit 1
          }
          page=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/")
          [ "$page" = "200" ] || { echo "::error::public page returned ${page}"; exit 1; }
          echo "public page ok"
          # Recorded for the release notes below. The value of writing this into
          # the release is that it is evidence tied to a moment: this build
          # answered on the public URL at this timestamp. Reading it later beats
          # trusting that a green tick somewhere once meant something.
          {
            echo "served_version=$served"
            echo "page_code=$page"
            echo "base=$BASE"
            echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          SERVED: ${{ steps.smoke.outputs.served_version }}
          PAGE_CODE: ${{ steps.smoke.outputs.page_code }}
          BASE: ${{ steps.smoke.outputs.base }}
          CHECKED_AT: ${{ steps.smoke.outputs.checked_at }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already released — version not bumped, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Notes: whatever was curated under Unreleased, then the commits
          # since the previous release. Neither needs maintaining for a release
          # to be readable. curated.md is also what the next step removes from
          # Unreleased, so it stays in $RUNNER_TEMP for the rest of the job.
          CURATED="$RUNNER_TEMP/curated.md"
          NOTES="$RUNNER_TEMP/notes.md"
          awk -f scripts/changelog-unreleased.awk CHANGELOG.md > "$CURATED"
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                   --json tagName -q '.[0].tagName' 2>/dev/null || true)
          {
            if [ -s "$CURATED" ]; then
              cat "$CURATED"
              printf '\n'
            fi
            printf '### Changes\n\n'
            if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
              git log --no-merges --pretty='- %s' "${PREV}..HEAD"
              printf '\n**Full diff**: %s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$PREV" "$TAG"
            else
              git log --no-merges --pretty='- %s' -20
            fi
            # Only what this deploy itself observed, a few minutes ago, against
            # the real public URL. Nothing here is read from another workflow's
            # run - a suite count borrowed from elsewhere would be describing a
            # different build.
            printf '\n### Verified at release\n\n'
            printf -- '- Rollout: `ksvc/www-skylar-technology` reached Ready\n'
            printf -- '- `GET %s/health` -> 200, reported version `%s`, matching the build this run stamped\n' \
              "$BASE" "$SERVED"
            printf -- '- `GET %s/` -> %s\n' "$BASE" "$PAGE_CODE"
            printf -- '- Checked at %s by [run %s](%s/%s/actions/runs/%s)\n' \
              "$CHECKED_AT" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '\nImage: `ghcr.io/klaushofrichter/www-skylar-technology:%s`\n' "$TAG"
          } > "$NOTES"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES"
          echo "Released $TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # The release notes consume whatever sits under Unreleased, but nothing
      # used to remove it afterwards, so the next release republished it all as
      # if it were new. That is not hypothetical: it happened on three releases
      # running and was cleared by hand each time. Clearing it here keeps the
      # section meaning "written but not yet published", which is what the file
      # says it is.
      #
      # Runs only when this job actually created a release, so a skipped or
      # re-run deploy never clears notes it did not publish.
      - name: Clear the Unreleased notes this release published
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          CURATED="$RUNNER_TEMP/curated.md"
          if [ ! -s "$CURATED" ]; then
            echo "Nothing was curated under Unreleased — nothing to clear."
            exit 0
          fi
          # Onto main, not production: main is where notes get written, and it
          # is where the next promotion reads them from. A temp clone keeps the
          # deploy's own checkout (production) untouched.
          rm -rf "$RUNNER_TEMP/changelog-clear"
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/changelog-clear"
          cd "$RUNNER_TEMP/changelog-clear"
          git config user.name "www-skylar-technology-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          # Same re-derive-and-retry shape as the kube-setup push: main moves
          # under us whenever a PR merges while a deploy is running.
          pushed=""
          for attempt in $(seq 1 5); do
            git fetch -q origin main
            git reset -q --hard origin/main
            # Removes only the lines this release published: a note merged
            # while the deploy ran must survive. The script comes from this
            # deploy's checkout, not from the clone of main being edited.
            awk -f "$GITHUB_WORKSPACE/scripts/changelog-clear-published.awk" \
              "$CURATED" CHANGELOG.md > "$RUNNER_TEMP/cleared.md"
            mv "$RUNNER_TEMP/cleared.md" CHANGELOG.md
            git add CHANGELOG.md
            if git diff --cached --quiet; then
              echo "Unreleased is already clear on main."
              pushed=1; break
            fi
            git commit -q -m "Clear the Unreleased notes published in v${VERSION}"
            if git push -q origin HEAD:main; then
              echo "Cleared Unreleased on main (attempt ${attempt})."
              pushed=1; break
            fi
            echo "Push rejected — main moved, retrying (${attempt}/5)."
            sleep $((attempt * 3))
          done
          # A warning, not a failure: the release is already published and the
          # site is already live, so failing the job here would misreport the
          # deploy. The only cost is that the notes need clearing by hand.
          [ -n "$pushed" ] || echo "::warning::could not clear Unreleased on main — clear it by hand before the next release"
